<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f0e4">
  <title>Promessas de Deus | VEREDA</title>
</head>
<body marginwidth="0" marginheight="0" leftmargin="0" topmargin="0">
  <svg id="screen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 941 1672" preserveAspectRatio="xMidYMin meet" role="application" aria-label="VEREDA Promessas de Deus">
    <image href="./assets/promessas-hero.webp?v=90" x="0" y="0" width="941" height="1672" preserveAspectRatio="none"/>

    <g id="promise-content" aria-live="polite">
      <line x1="316" y1="437" x2="385" y2="437" stroke="#b58531" stroke-width="1.3"/>
      <line x1="556" y1="437" x2="625" y2="437" stroke="#b58531" stroke-width="1.3"/>
      <text id="promise-category" x="470.5" y="444" text-anchor="middle" fill="#b58531" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3"></text>
      <g id="promise-lines"></g>
      <text id="promise-reference" x="470.5" y="710" text-anchor="middle" fill="#183b31" font-family="Georgia, Times New Roman, serif" font-size="27" font-weight="700"></text>
      <text id="promise-translation" x="470.5" y="748" text-anchor="middle" fill="#6d7b76" font-family="Arial, Helvetica, sans-serif" font-size="16"></text>
    </g>

    <circle id="saved-ring" cx="229" cy="1228" r="55" fill="none" stroke="#b58531" stroke-width="4" opacity="0"/>

    <g id="toast" visibility="hidden" opacity="0">
      <rect x="255" y="1102" width="431" height="56" rx="28" fill="#153f34" fill-opacity=".96"/>
      <text id="toast-text" x="470.5" y="1138" text-anchor="middle" fill="#fff7e9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"></text>
    </g>

    <g id="saved-panel" visibility="hidden">
      <rect x="85" y="190" width="771" height="1125" rx="36" fill="#fffaf0" fill-opacity=".985" stroke="#d9bf8d" stroke-width="2"/>
      <text x="125" y="260" fill="#b58531" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.5">PROMESSAS GUARDADAS</text>
      <text x="125" y="315" fill="#183b31" font-family="Georgia, Times New Roman, serif" font-size="32">Guardadas</text>
      <g id="saved-items"></g>
      <g id="saved-close" role="button" tabindex="0" aria-label="Fechar guardadas">
        <circle cx="802" cy="245" r="30" fill="#efe4d0"/>
        <line x1="790" y1="233" x2="814" y2="257" stroke="#183b31" stroke-width="3" stroke-linecap="round"/>
        <line x1="814" y1="233" x2="790" y2="257" stroke="#183b31" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <g id="hit-save" role="button" tabindex="0" aria-label="Guardar promessa"><rect x="135" y="1160" width="190" height="160" fill="#000" fill-opacity="0"/></g>
    <g id="hit-share" role="button" tabindex="0" aria-label="Compartilhar promessa"><rect x="375" y="1160" width="190" height="160" fill="#000" fill-opacity="0"/></g>
    <g id="hit-bible" role="button" tabindex="0" aria-label="Ler na Bíblia"><rect x="615" y="1160" width="190" height="160" fill="#000" fill-opacity="0"/></g>
    <g id="hit-new" role="button" tabindex="0" aria-label="Receber outra promessa"><rect x="150" y="1340" width="640" height="105" fill="#000" fill-opacity="0"/></g>

    <g id="nav-home" role="button" tabindex="0" aria-label="Início"><rect x="20" y="1510" width="180" height="150" fill="#000" fill-opacity="0"/></g>
    <g id="nav-saved" role="button" tabindex="0" aria-label="Guardadas"><rect x="200" y="1510" width="180" height="150" fill="#000" fill-opacity="0"/></g>
    <g id="nav-share" role="button" tabindex="0" aria-label="Compartilhar"><rect x="380" y="1510" width="180" height="150" fill="#000" fill-opacity="0"/></g>
    <g id="nav-bible" role="button" tabindex="0" aria-label="Bíblia"><rect x="560" y="1510" width="180" height="150" fill="#000" fill-opacity="0"/></g>
    <g id="nav-settings" role="button" tabindex="0" aria-label="Informações"><rect x="740" y="1510" width="180" height="150" fill="#000" fill-opacity="0"/></g>
  </svg>

  <script type="module" src="./assets/app.js?v=90"></script>
</body>
</html>
