<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="VEREDA | Promessas de Deus" />
  <meta name="theme-color" content="#173d31" />
  <title>Promessas de Deus | VEREDA</title>
  <link rel="stylesheet" href="./assets/styles.css?v=52" />
  <link rel="stylesheet" href="./assets/exact.css?v=52" />
</head>
<body>
  <main class="experience" id="experience">
    <div class="reference-frame" id="reference-frame" aria-label="VEREDA Promessas de Deus">
      <div class="art-dimmer" aria-hidden="true"></div>

      <section class="dynamic-paper" id="dynamic-paper" aria-live="polite" aria-label="Promessa atual">
        <div class="paper-category"><span></span><strong id="promise-category">PROMESSA</strong><span></span></div>
        <blockquote id="promise-text"></blockquote>
        <div class="paper-divider" aria-hidden="true"><i></i><b>❦</b><i></i></div>
        <p class="paper-reference" id="promise-reference"></p>
        <p class="paper-translation" id="promise-translation"></p>
      </section>

      <button class="hit theme-hit" id="theme-toggle" type="button" aria-label="Alternar modo claro e escuro"></button>
      <button class="hit save-hit" id="save-promise" type="button" aria-label="Guardar promessa"></button>
      <button class="hit share-hit" id="share-promise" type="button" aria-label="Compartilhar promessa"></button>
      <button class="hit bible-hit" id="read-bible" type="button" aria-label="Ler na Bíblia"></button>
      <button class="hit new-hit" id="new-promise" type="button" aria-label="Receber outra promessa"></button>

      <nav class="nav-hotspots" aria-label="Navegação principal">
        <button class="hit nav-hit nav-home" data-nav="inicio" type="button" aria-label="Início"></button>
        <button class="hit nav-hit nav-saved" data-nav="guardadas" type="button" aria-label="Guardadas"></button>
        <button class="hit nav-hit nav-share" data-nav="compartilhar" type="button" aria-label="Compartilhar"></button>
        <button class="hit nav-hit nav-bible" data-nav="biblia" type="button" aria-label="Bíblia"></button>
        <button class="hit nav-hit nav-settings" data-nav="ajustes" type="button" aria-label="Ajustes"></button>
      </nav>

      <div class="save-state" id="save-state" aria-hidden="true"></div>
      <div class="paper-glint" id="paper-glint" aria-hidden="true"></div>
    </div>
  </main>

  <div class="opening-veil" id="opening-veil" aria-hidden="true"><div class="veil-mark">VEREDA<span>PROMESSAS DE DEUS</span></div></div>

  <dialog class="sheet" id="saved-sheet">
    <button class="sheet-close" data-close="saved-sheet" type="button" aria-label="Fechar">×</button>
    <p class="eyebrow">Sua caminhada</p>
    <h2>Promessas guardadas</h2>
    <div class="saved-list" id="saved-list"></div>
  </dialog>

  <dialog class="sheet" id="share-sheet">
    <button class="sheet-close" data-close="share-sheet" type="button" aria-label="Fechar">×</button>
    <p class="eyebrow">Compartilhar promessa</p>
    <h2>Leve a Palavra com você</h2>
    <div class="share-card" id="share-card"></div>
    <button class="sheet-primary" id="native-share" type="button">Compartilhar</button>
    <button class="sheet-secondary" id="copy-share" type="button">Copiar texto</button>
  </dialog>

  <dialog class="sheet compact" id="settings-sheet">
    <button class="sheet-close" data-close="settings-sheet" type="button" aria-label="Fechar">×</button>
    <p class="eyebrow">Sua experiência</p>
    <h2>Ajustes</h2>
    <button class="setting-button" id="setting-theme" type="button">Alternar modo claro/escuro</button>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./assets/app.js?v=52"></script>
</body>
</html>
