<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4ecdc">
<title>Promessas de Deus | VEREDA</title>
<link rel="stylesheet" href="./assets/styles.css?v=70">
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand-seal" aria-hidden="true">✦</div><div><h1>Promessas de Deus</h1><p>VEREDA</p></div></header>
<section class="stage" aria-label="Sua promessa">
<div class="atmosphere" aria-hidden="true"><i class="glow"></i><i class="leaf leaf-a">❧</i><i class="leaf leaf-b">❧</i><i class="leaf leaf-c">❧</i></div>
<div class="reliquary" id="reliquary">
  <div class="paper-wrap" id="paper-wrap">
    <article class="promise-paper" id="promise-paper" aria-live="polite">
      <div class="paper-brand"><span class="sprig">♧</span><b>V E R E D A</b><small>PROMESSAS DE DEUS</small></div>
      <div class="category"><i></i><strong id="promise-category">PROMESSA</strong><i></i></div>
      <blockquote id="promise-text"></blockquote>
      <div class="ornament">❦</div>
      <p class="reference" id="promise-reference"></p><p class="translation" id="promise-translation"></p>
      <svg class="paper-landscape" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 88C104 42 170 77 257 49c99-31 179-10 343 34v37H0Z" fill="#d9dfc6"/><path d="M0 103c109-26 199-14 279-29 108-20 210-8 321 20v26H0Z" fill="#c8d2b4" opacity=".75"/></svg>
    </article>
  </div>
  <div class="box" aria-hidden="true">
    <div class="box-back"></div><div class="box-body"><div class="box-gold"></div><div class="box-mark">VEREDA<span>PROMESSAS DE DEUS</span></div><div class="box-leaf">❧</div></div><div class="box-front"></div>
  </div>
</div>
</section>
<section class="actions" aria-label="Ações da promessa">
<button id="save-promise" class="action"><span class="action-icon">♡</span><b>Guardar</b></button>
<button id="share-promise" class="action"><span class="action-icon">⌯</span><b>Compartilhar</b></button>
<button id="read-bible" class="action"><span class="action-icon">✚</span><b>Ler na Bíblia</b></button>
</section>
<button id="new-promise" class="new-promise"><span>↻</span> RECEBER OUTRA PROMESSA</button>
<nav class="bottom-nav"><button class="active" data-nav="inicio"><span>⌂</span>Início</button><button data-nav="guardadas"><span>♡</span>Guardadas</button><button data-nav="compartilhar"><span>⌯</span>Compartilhar</button><button data-nav="biblia"><span>✚</span>Bíblia</button></nav>
</main>
<dialog class="sheet" id="saved-sheet"><button class="close" data-close="saved-sheet">×</button><small>VEREDA</small><h2>Promessas guardadas</h2><div id="saved-list" class="saved-list"></div></dialog>
<dialog class="sheet" id="share-sheet"><button class="close" data-close="share-sheet">×</button><small>VEREDA · PROMESSAS DE DEUS</small><h2>Compartilhar promessa</h2><div id="share-card" class="share-card"></div><button id="native-share" class="sheet-main">Compartilhar</button><button id="copy-share" class="sheet-alt">Copiar texto</button></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="./assets/app.js?v=70"></script>
</body></html>
